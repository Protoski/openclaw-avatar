<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Agente OpenClaw</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, sans-serif; user-select: none;
  }
  body { background: #0b0f14; }
  /* modo ventana translúcida: el fondo lo pone el escritorio */
  body.transparent { background: transparent; }

  #scene { position: absolute; inset: 0; }

  #status {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: #7fe0ff; background: rgba(10,20,30,.65); border: 1px solid #24405a;
    padding: 5px 14px; border-radius: 999px; backdrop-filter: blur(6px);
    pointer-events: none;
  }
  #status[data-state="listening"] { color: #4ade80; border-color: #2b6b46; }
  #status[data-state="thinking"]  { color: #fbbf24; border-color: #6b5524; }

  #winbtns {
    position: absolute; top: 10px; right: 12px; display: none; gap: 6px;
  }
  body.transparent #winbtns { display: flex; }
  #winbtns button {
    width: 26px; height: 26px; padding: 0; border-radius: 50%;
    background: rgba(10,20,30,.65); border: 1px solid #24405a; color: #7fe0ff;
    font-size: 12px; line-height: 1; backdrop-filter: blur(6px);
  }
  #winbtns button.on { color: #fbbf24; border-color: #6b5524; }
  #close:hover { background: #dc2626; color: white; }

  #bar {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 6px; width: min(520px, calc(100% - 24px));
  }
  #text {
    flex: 1; min-width: 0; padding: 9px 11px; border-radius: 9px;
    border: 1px solid #24405a; background: rgba(14,22,30,.85); color: #e8ecf1;
    font-size: 13px; outline: none; user-select: text; backdrop-filter: blur(6px);
  }
  #text:focus { border-color: #3ab6ff; }
  button {
    padding: 9px 12px; border-radius: 9px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; color: white; transition: opacity .15s;
    white-space: nowrap;
  }
  button:disabled { opacity: .35; cursor: default; }
  #send { background: rgba(37,99,235,.92); }
  #mic  { background: rgba(22,163,74,.92); }
  #stop { background: rgba(220,38,38,.92); }

  #hint {
    position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
    font-size: 9px; color: #45607a; pointer-events: none; white-space: nowrap;
  }
  /* en ventana chica no hay lugar para el texto de ayuda ni el placeholder largo */
  @media (max-height: 560px) { #hint { display: none; } }
  @media (max-width: 380px) {
    #send { padding: 9px 10px; }
    #status { font-size: 10px; padding: 4px 11px; top: 10px; }
  }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="status" data-state="idle">Listo</div>
  <div id="winbtns">
    <button id="pin" class="on" title="Mantener sobre otras ventanas">📌</button>
    <button id="close" title="Cerrar (Ctrl+Q)">✕</button>
  </div>
  <div id="bar">
    <input id="text" type="text" placeholder="Escribí un mensaje…" autocomplete="off" />
    <button id="mic" title="Hablar (graba 6 s)">🎙</button>
    <button id="send">Enviar</button>
    <button id="stop" hidden title="Cortar la voz (Esc)">■</button>
  </div>
  <div id="hint">arrastrá el robot para mover · rueda = desplazar texto</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
